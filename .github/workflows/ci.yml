name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Tidy
        run: go mod tidy -diff
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Coverage
        run: make cover
      - name: Build
        run: go build -o quikaitools ./cmd/quikaitools
      - name: Doctor smoke
        run: ./quikaitools doctor --profile cpu && ./quikaitools catalog --machine halo --task generate

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Coverage
        # make exists on windows-latest (Git for Windows/MSYS), but the Makefile
        # cover target uses awk/tr for the 70% gate and is unreliable under
        # pwsh. Run the same go test; skip the coverage threshold.
        run: go test -coverpkg=./internal/... ./internal/... -coverprofile=coverage.out -covermode=atomic
      - name: Build
        run: go build -o quikaitools.exe ./cmd/quikaitools
